<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>حاسبة الحقوق التناسبية | العدالة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(145deg, #1a2a2f, #0e1a1f);
        font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', 'El Messiri', serif;
        padding: 30px 20px;
        position: relative;
    }
    
    /* زخرفة إسلامية فاخرة بلون ذهبي وعنابي - نقش هندسي متداخل */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.2"><path fill="none" stroke="%23c9a03d" stroke-width="1.2" d="M100 20 L130 60 L100 100 L70 60 Z M100 100 L130 140 L100 180 L70 140 Z M40 60 L70 100 L40 140 L10 100 Z M160 60 L190 100 L160 140 L130 100 Z M100 20 L70 60 L100 100 L130 60 Z M100 100 L70 140 L100 180 L130 140 Z"/><circle cx="100" cy="100" r="28" fill="none" stroke="%23b88a3a" stroke-width="1"/><path d="M100 35 L100 165 M35 100 L165 100" stroke="%23a57c2c" stroke-width="0.8" opacity="0.6"/><path d="M60 60 L140 140 M140 60 L60 140" stroke="%23c9a03d" stroke-width="0.8" opacity="0.5"/></svg>'),
            repeating-linear-gradient(45deg, rgba(180, 130, 70, 0.08) 0px, rgba(180, 130, 70, 0.08) 2px, transparent 2px, transparent 12px),
            radial-gradient(circle at 20% 30%, rgba(150, 100, 50, 0.1) 0%, transparent 50%);
        background-repeat: repeat, repeat, no-repeat;
        background-size: 55px 55px, auto, auto;
        pointer-events: none;
        z-index: 0;
    }
    
    /* طبقة ثانية من الزخرفة الإسلامية الناعمة */
    body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(circle at 80% 70%, rgba(200, 150, 80, 0.08) 1px, transparent 1px);
        background-size: 35px 35px;
        pointer-events: none;
        z-index: 0;
    }

    .container {
        max-width: 630px;
        margin: auto;
        position: relative;
        z-index: 2;
        border-radius: 70px 50px 70px 50px;
        padding: 30px 30px 35px;
        /* خلفية أكثر بهتاناً */
        background: rgba(10, 20, 22, 0.65);
        backdrop-filter: blur(5px);
        box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(212, 175, 55, 0.45);
        border: 1px solid rgba(212, 175, 55, 0.5);
        /* صورة الخلفية مع بهتان قوي */
        background-image: url('logo.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-blend-mode: soft-light;
        background-color: rgba(10, 25, 28, 0.75);
    }
    
    /* زخارف عمودية مطوقة ذهبية */
    .container::before {
        content: "";
        position: absolute;
        top: 30px;
        bottom: 30px;
        right: -10px;
        width: 6px;
        background: linear-gradient(180deg, #e7bc5e, #b8860b, #e7bc5e);
        border-radius: 20px;
        box-shadow: 0 0 12px #ffd966;
        z-index: 5;
    }
    
    .container::after {
        content: "";
        position: absolute;
        top: 30px;
        bottom: 30px;
        left: -10px;
        width: 6px;
        background: linear-gradient(180deg, #e7bc5e, #b8860b, #e7bc5e);
        border-radius: 20px;
        box-shadow: 0 0 12px #ffd966;
        z-index: 5;
    }
    
    /* اللوقو العلوي أكبر */
    .small-logo {
        text-align: center;
        margin-bottom: 18px;
    }
    
    .small-logo-img {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 3px solid #e7bc5e;
        padding: 6px;
        background: rgba(0, 0, 0, 0.4);
        box-shadow: 0 0 25px rgba(231, 188, 94, 0.6);
        transition: transform 0.3s;
    }
    
    .small-logo-img:hover {
        transform: scale(1.03);
    }
    
    .title-wrapper {
        text-align: center;
        margin-bottom: 15px;
    }
    
    h1 {
        font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
        font-size: 2.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #f7e5b5, #e7bc5e, #d4a017);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        margin: 0;
        display: inline-block;
    }
    
    h1:before, h1:after {
        content: "﴿";
        font-family: 'Traditional Arabic', 'Amiri', serif;
        font-size: 1.8rem;
        color: #e7bc5e;
    }
    h1:before {
        content: "﴿";
        margin-left: 12px;
    }
    h1:after {
        content: "﴾";
        margin-right: 12px;
    }
    
    .author-container {
        text-align: center;
        margin: 12px 0 20px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 70px;
        padding: 15px 20px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(231, 188, 94, 0.5);
    }
    
    .gold-author {
        font-size: 1.6rem;
        font-weight: 800;
        color: #f3cd81;
        font-family: 'Traditional Arabic', 'Amiri', serif;
        letter-spacing: 1px;
        text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
    
    .gold-author i {
        margin: 0 8px;
        color: #e7bc5e;
        font-size: 1.3rem;
    }
    
    .developer {
        font-size: 1.15rem;
        color: #dbbc7a;
        margin-top: 10px;
        border-top: 1px dashed rgba(231, 188, 94, 0.5);
        display: inline-block;
        padding-top: 8px;
        padding-left: 18px;
        padding-right: 18px;
        font-weight: 500;
    }
    
    .developer i {
        margin: 0 6px;
        font-size: 0.95rem;
    }
    
    label {
        display: block;
        font-weight: 700;
        color: #fff5e6;
        margin-top: 20px;
        margin-bottom: 8px;
        font-size: 1.15rem;
        padding-right: 12px;
        text-shadow: 0 1px 2px black;
    }
    
    label i {
        margin-left: 10px;
        color: #f5cb5c;
    }
    
    input {
        width: 100%;
        padding: 14px 18px;
        border-radius: 55px;
        border: none;
        background: rgba(255, 252, 240, 0.95);
        font-size: 1.1rem;
        font-family: 'Amiri', monospace;
        text-align: center;
        color: #1f3d35;
        box-shadow: inset 0 0 0 1px #e7bc5e, 0 4px 10px rgba(0,0,0,0.2);
    }
    
    input:focus {
        outline: none;
        background: #fffff2;
        box-shadow: inset 0 0 0 2px #f5c542;
    }
    
    .button-group {
        display: flex;
        gap: 20px;
        margin: 32px 0 20px;
    }
    
    button {
        flex: 1;
        padding: 13px 12px;
        border: none;
        border-radius: 60px;
        font-weight: bold;
        font-size: 1.2rem;
        font-family: 'Amiri', sans-serif;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #fff0cf;
        border-bottom: 3px solid #e7bc5e;
        transition: 0.2s;
    }
    
    .calc {
        background: linear-gradient(145deg, #2c6b52, #1e5540);
    }
    
    .calc:hover {
        background: linear-gradient(145deg, #3e8a6b, #2a6b4f);
        transform: translateY(-2px);
    }
    
    .clear {
        background: linear-gradient(145deg, #8b5a48, #6b4232);
    }
    
    .clear:hover {
        background: linear-gradient(145deg, #a8735c, #82553f);
        transform: translateY(-2px);
    }
    
    button:active {
        transform: translateY(2px);
        border-bottom-width: 1px;
    }
    
    .result {
        margin-top: 28px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        border-radius: 50px;
        padding: 20px 24px;
        border: 1px solid rgba(220, 180, 70, 0.7);
    }
    
    .result p {
        display: flex;
        justify-content: space-between;
        margin: 12px 0;
        color: #fff6e5;
        border-bottom: 1px dashed rgba(212, 175, 55, 0.5);
        padding-bottom: 7px;
    }
    
    .result span:last-child {
        font-family: monospace;
        font-weight: 700;
        background: #1f352e;
        padding: 4px 14px;
        border-radius: 40px;
        color: #ffdf9c;
    }
    
    hr {
        margin: 14px 0;
        border-color: #d4af3755;
    }
    
    .total {
        margin-top: 28px;
        background: rgba(30, 30, 20, 0.7);
        backdrop-filter: blur(8px);
        padding: 18px 16px;
        text-align: center;
        border-radius: 55px;
        border: 1px solid rgba(212, 175, 55, 0.5);
    }
    
    .total span:first-child {
        color: #ffefcf;
        font-size: 1.3rem;
    }
    
    .total span:last-child {
        background: rgba(0, 0, 0, 0.6);
        color: #ff5e5e;
        font-size: 1.5rem;
        font-weight: 900;
        padding: 6px 18px;
        border-radius: 50px;
        margin-right: 12px;
    }
    
    .islamic-footer {
        text-align: center;
        margin-top: 30px;
        padding-top: 18px;
        border-top: 1px solid rgba(231, 188, 94, 0.5);
    }
    
    .justice-balance {
        font-size: 2rem;
        letter-spacing: 12px;
        color: #e2bc6e;
        margin-bottom: 12px;
    }
    
    .justice-balance i {
        margin: 0 8px;
        font-size: 1.8rem;
        text-shadow: 0 0 5px rgba(226, 188, 110, 0.6);
    }
    
    .copyright {
        text-align: center;
        font-size: 0.85rem;
        color: #dbbc8a;
    }
    
    @media (max-width: 560px) {
        .container { padding: 22px 18px; }
        h1 { font-size: 1.8rem; }
        .total span:last-child { font-size: 1.2rem; }
        .small-logo-img { width: 95px; height: 95px; }
        .gold-author { font-size: 1.3rem; }
        .developer { font-size: 1rem; }
        .justice-balance { font-size: 1.5rem; }
        .justice-balance i { font-size: 1.3rem; }
    }
</style>
</head>
<body>

<div class="container">
    
    <!-- اللوقو العلوي أكبر -->
    <div class="small-logo">
        <img src="logo.png" alt="شعار العدالة" class="small-logo-img" onerror="this.src='https://via.placeholder.com/130?text=عدالة'">
    </div>
    
    <div class="title-wrapper">
        <h1>حاسبة الحقوق التناسبية</h1>
    </div>
    
    <div class="author-container">
        <div class="gold-author">
            <i class="fas fa-user-graduate"></i> الأستاذ بوروبة سفيان <i class="fas fa-feather-alt"></i>
        </div>
        <div class="developer">
            <i class="fas fa-laptop-code"></i> المطور هشام الجزائري <i class="fas fa-code"></i>
        </div>
    </div>
    
    <label><i class="fas fa-sack-dollar"></i> مبلغ الدين (دج)</label>
    <input type="number" id="amount" placeholder="أدخل المبلغ المستحق" step="any">
    
    <label><i class="fas fa-file-contract"></i> مصاريف التنفيذ (دج)</label>
    <input type="number" id="execution" value="0" placeholder="المصاريف القضائية">
    
    <div class="button-group">
        <button class="calc" onclick="calculate()"><i class="fas fa-calculator"></i> احسب الحقوق</button>
        <button class="clear" onclick="clearAll()"><i class="fas fa-broom"></i> مسح الكل</button>
    </div>
    
    <div id="result" class="result" style="display:none;">
        <p><span>مبلغ الدين:</span><span id="a"></span></p>
        <p><span>مصاريف التنفيذ:</span><span id="b"></span></p>
        <hr>
        <p><span>مبلغ الحقوق التناسبية:</span><span id="c"></span></p>
        <p><span>الرسم على القيمة المضافة 19%:</span><span id="d"></span></p>
        <p><span>مجموع الحقوق مع الرسم:</span><span id="e"></span></p>
    </div>
    
    <div id="totalSection" style="display:none;" class="total">
        <span>المجموع الكلي المستحق:</span>
        <span id="f">0 دج</span>
    </div>
    
    <div class="islamic-footer">
        <div class="justice-balance">
            <i class="fas fa-balance-scale"></i> ⚖️ <i class="fas fa-gavel"></i> ⚖️ <i class="fas fa-balance-scale"></i>
        </div>
        <div class="copyright">
            <i class="fas fa-copyright"></i> حقوق النشر محفوظة للأستاذ بوروبة سفيان • المطور هشام الجزائري • الجزائر 2026
        </div>
    </div>
</div>

<script>
    function format(num) {
        if (isNaN(num)) num = 0;
        return num.toLocaleString('fr-DZ') + " دج";
    }
    
    function calculate() {
        let amount = parseFloat(document.getElementById("amount").value) || 0;
        let execution = parseFloat(document.getElementById("execution").value) || 0;
        let rights = 0;
        
        if (amount > 0) {
            let tier1 = Math.min(amount, 100000);
            rights += tier1 * 0.08;
            if (amount > 100000) {
                let tier2 = Math.min(amount - 100000, 900000);
                rights += tier2 * 0.06;
                if (amount > 1000000) {
                    let tier3 = Math.min(amount - 1000000, 1000000);
                    rights += tier3 * 0.04;
                    if (amount > 2000000) {
                        let tier4 = Math.min(amount - 2000000, 1000000);
                        rights += tier4 * 0.03;
                        if (amount > 3000000) {
                            let tier5 = Math.min(amount - 3000000, 97000000);
                            rights += tier5 * 0.02;
                            if (amount > 100000000) {
                                rights += (amount - 100000000) * 0.01;
                            }
                        }
                    }
                }
            }
        }
        
        let vat = rights * 0.19;
        let totalRights = rights + vat;
        let total = amount + execution + totalRights;
        
        document.getElementById("a").innerText = format(amount);
        document.getElementById("b").innerText = format(execution);
        document.getElementById("c").innerText = format(rights);
        document.getElementById("d").innerText = format(vat);
        document.getElementById("e").innerText = format(totalRights);
        document.getElementById("f").innerText = format(total);
        
        document.getElementById("result").style.display = "block";
        document.getElementById("totalSection").style.display = "block";
    }
    
    function clearAll() {
        document.getElementById("amount").value = "";
        document.getElementById("execution").value = "0";
        document.getElementById("result").style.display = "none";
        document.getElementById("totalSection").style.display = "none";
    }
    
    document.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('keypress', e => { if (e.key === 'Enter') calculate(); });
    });
</script>
</body>
</html>
